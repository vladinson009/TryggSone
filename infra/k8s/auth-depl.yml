apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: tryggsone-auth
        ports:
        - containerPort: 3000
        # env:
        #   - name: DATABASE_URL
        #     value: 'postgresql://test-postgres:test-postgres@postgres-auth-srv:5432/auth'
        envFrom:
          - secretRef:
              name: auth-secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  ports:
  - port: 3000
    targetPort: 3000

