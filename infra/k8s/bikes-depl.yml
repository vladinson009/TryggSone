apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikes-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bikes
  template:
    metadata:
      labels:
        app: bikes
    spec:
      containers:
      - name: bikes
        image: tryggsone-bikes
        ports:
        - containerPort: 3000
        envFrom:
          - secretRef:
              name: bikes-secret
          - configMapRef:
              name: rabbitmq-config
        env: 
          - name: RABBITMQ_USERNAME
            valueFrom:
              secretKeyRef:
                name: rabbitmq-default-user
                key: username
          - name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rabbitmq-default-user
                key: password
---
apiVersion: v1
kind: Service
metadata:
  name: bikes-srv
spec:
  selector:
    app: bikes
  ports:
  - port: 3000
    targetPort: 3000

