apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: tryggsone

deploy:
    kubectl: {}

manifests:
  rawYaml:
          - ./infra/k8s/ingress-srv.yml
          - ./infra/k8s/bff-depl.yml
          - ./infra/k8s/auth-depl.yml
          - ./infra/k8s/auth-pg-depl.yml
        # - ./infra/k8s/*
        # - ./infra/k8s-dev/*

build:
  local:
    push: false

  artifacts:
    - image: tryggsone-bff
      context: bff
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: /app
    - image: tryggsone-auth
      context: auth
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: /app
            

