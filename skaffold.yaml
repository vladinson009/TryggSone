apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: tryggsone

deploy:
    kubectl: {}

manifests:
  rawYaml:
        - ./infra/k8s/*
        # - ./infra/k8s-dev/*

build:
  local:
    push: false

  artifacts:
    - image: tryggsone-bff
      context: bff
      docker:
        dockerfile: Dockerfile
        target: development
      sync:
        manual:
          - dest: /app/src
            src: "src/**/*.ts"
